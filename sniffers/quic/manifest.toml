name = "quic"
description = "Recognises a QUIC Initial (v1, v2, drafts 29-34) and returns the TLS SNI as the host when the first Initial carries it."
license = "MIT OR Apache-2.0"
version = "0.1.0"
abi = "0.1"
min_proxy = "0.1.0"
homepage = "https://github.com/wayhouse-proxy/sniffers/tree/main/sniffers/quic"

# Advisory: the proxy's own settings.sniffers values apply (defaults shown).
[limits]
max_memory_bytes = 16777216
call_timeout_ms = 20
