name = "teamspeak3"
description = "Recognises the TeamSpeak 3 voice server's TS3INIT1 client init packet and tags it key \"teamspeak3\"."
license = "MIT OR Apache-2.0"
version = "0.1.0"
abi = "0.1"
min_proxy = "0.1.0"
homepage = "https://github.com/wayhouse-proxy/sniffers/tree/main/sniffers/teamspeak3"

# Advisory: the proxy's own settings.sniffers values apply (defaults shown).
[limits]
max_memory_bytes = 16777216
call_timeout_ms = 20
