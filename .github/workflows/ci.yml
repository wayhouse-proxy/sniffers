name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  # Every sniffer is built for wasm32-unknown-unknown, tested natively, checked against
  # its manifest and run through the real registry validator (wayhouse-registry-gen),
  # which also checks that the module declares the ABI the manifest says.
  build:
    name: build, test and validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: ./.github/actions/registry-gen
      - run: python3 scripts/stage_test.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Native unit tests
        run: cargo test --locked --workspace
      - name: Build to wasm32-unknown-unknown
        run: cargo build --locked --release --target wasm32-unknown-unknown --workspace
      - name: Check manifests and stage the modules
        run: python3 scripts/stage.py
      - name: Generate an index and parse it with the real validator
        run: |
          set -euo pipefail
          wayhouse-registry-gen generate --name "ci check" \
            --base-url https://github.com/wayhouse-proxy/sniffers/releases/download \
            --out "$RUNNER_TEMP/index.json" dist/*
          wayhouse-registry-gen verify "$RUNNER_TEMP/index.json"
      - name: The committed index.json (when present) still parses
        run: |
          if [ -f index.json ]; then wayhouse-registry-gen verify index.json; else echo "no index.json yet"; fi
      - name: The release signing path works (throwaway key)
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y minisign
          d=$(mktemp -d)
          minisign -G -W -p "$d/k.pub" -s "$d/k.key" >/dev/null
          minisign -S -s "$d/k.key" -m dist/a2s/a2s.wasm -x "$d/a2s.wasm.minisig" >/dev/null
          minisign -V -p "$d/k.pub" -m dist/a2s/a2s.wasm -x "$d/a2s.wasm.minisig"
      - name: Sizes
        run: |
          {
            echo '| sniffer | wasm bytes |'
            echo '|---|---|'
            for f in dist/*/*.wasm; do echo "| $(basename "$f" .wasm) | $(stat -c %s "$f") |"; done
          } >> "$GITHUB_STEP_SUMMARY"

  # The one check to require in the branch ruleset.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          [ "${{ needs.build.result }}" = "success" ] || { echo "build: ${{ needs.build.result }}"; exit 1; }
